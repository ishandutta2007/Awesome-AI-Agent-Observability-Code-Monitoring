<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="blurFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.18; stroke-width: 1; }
    .pulse-orb-1 {
      animation: floatOrb1 9s ease-in-out infinite alternate;
    }
    .pulse-orb-2 {
      animation: floatOrb2 12s ease-in-out infinite alternate;
    }
    .data-stream {
      stroke-dasharray: 8 16;
      animation: flowStream 20s linear infinite;
    }
    .data-stream-rev {
      stroke-dasharray: 6 12;
      animation: flowStreamRev 16s linear infinite;
    }
    .ping-circle {
      animation: radarPing 3.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .pulse-pill {
      animation: pillFade 4s ease-in-out infinite alternate;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(80px, 40px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1.1); }
      100% { transform: translate(-70px, -30px) scale(0.9); }
    }
    @keyframes flowStream {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -300; }
    }
    @keyframes flowStreamRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 300; }
    }
    @keyframes radarPing {
      0% { r: 4px; opacity: 1; }
      75% { r: 35px; opacity: 0; }
      100% { r: 40px; opacity: 0; }
    }
    @keyframes pillFade {
      0% { opacity: 0.85; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambient Lights (Behind Canvas) -->
  <g filter="url(#blurFilter)">
    <circle cx="220" cy="140" r="160" fill="url(#glowCyan)" class="pulse-orb-1" />
    <circle cx="980" cy="260" r="180" fill="url(#glowPurple)" class="pulse-orb-2" />
    <circle cx="600" cy="360" r="130" fill="#0284c7" opacity="0.3" class="pulse-orb-1" />
  </g>

  <!-- High-Tech Matrix Grid -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Trace Circuit Topology (Telemetry Stream in Background) -->
  <g opacity="0.45">
    <path d="M 80 320 Q 240 370 420 320 T 780 340 T 1120 310" fill="none" stroke="#38bdf8" stroke-width="2.5" class="data-stream" />
    <path d="M 60 110 Q 320 60 580 100 T 960 80 T 1140 120" fill="none" stroke="#a855f7" stroke-width="2" class="data-stream-rev" />
    
    <!-- Radar Telemetry Beacon 1 -->
    <g transform="translate(180, 325)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" class="ping-circle" />
    </g>

    <!-- Radar Telemetry Beacon 2 -->
    <g transform="translate(1020, 95)">
      <circle cx="0" cy="0" r="4" fill="#c084fc" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#c084fc" stroke-width="1.5" class="ping-circle" />
    </g>
  </g>

  <!-- Outer Protective Futuristic Frame -->
  <rect x="25" y="25" width="1150" height="370" rx="20" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="45" cy="45" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="65" cy="45" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="85" cy="45" r="5" fill="#22c55e" opacity="0.8" />

  <!-- ================= FOREGROUND (Crisp & High Contrast) ================= -->

  <!-- Top Category Chip -->
  <g transform="translate(435, 52)">
    <rect x="0" y="0" width="330" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="20" cy="17" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">TELEMETRY &amp; TRACING ECOSYSTEM</text>
  </g>

  <!-- Primary Headline (Always Clear & Sharp in Foreground) -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" filter="url(#softGlow)" letter-spacing="-0.5">
    AI AGENT OBSERVABILITY
  </text>
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    &amp; CODE MONITORING
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Autonomous Coding Agent Sessions • OpenTelemetry Spans • Token &amp; Cost Telemetry • Trajectory Diagnostics
  </text>

  <!-- Interactive/Dynamic Feature Badges (Pills) -->
  <g transform="translate(130, 285)" class="pulse-pill">
    <!-- Pill 1: Claude Code & Agents -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="215" height="42" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="107" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0f2fe">🤖 Coding Agent Telemetry</text>
    </g>

    <!-- Pill 2: OpenTelemetry Tracing -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="225" height="42" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="112" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ede9fe">⚡ OpenTelemetry Tracing</text>
    </g>

    <!-- Pill 3: Token Burn & Cost -->
    <g transform="translate(490, 0)">
      <rect x="0" y="0" width="215" height="42" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6" />
      <text x="107" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f5d0fe">💰 Token &amp; Cost Tracking</text>
    </g>

    <!-- Pill 4: Trajectory Reliability -->
    <g transform="translate(730, 0)">
      <rect x="0" y="0" width="210" height="42" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
      <text x="105" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d1fae5">🎯 Trajectory Evals &amp; CI/CD</text>
    </g>
  </g>

  <!-- Live Status Footnote -->
  <g transform="translate(490, 355)">
    <circle cx="15" cy="15" r="4" fill="#10b981">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.5">CURATED LIST OF SAAS &amp; OPEN-SOURCE ENGINES</text>
  </g>
</svg>
